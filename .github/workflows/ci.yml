name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @calibre-cloud/web exec playwright install --with-deps --only-shell chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Write coverage to the job summary
        run: |
          {
            echo '### Coverage'
            echo
            echo '| Run | Statements | Branches | Functions | Lines |'
            echo '|---|---|---|---|---|'
            for run in web deploy-cloudflare api; do
              jq -r --arg run "$run" '.total | "| \($run) | \(.statements.pct)% | \(.branches.pct)% | \(.functions.pct)% | \(.lines.pct)% |"' "coverage/$run/coverage-summary.json"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
      - run: pnpm build
      - name: Smoke-check the built app under wrangler dev
        run: pnpm --filter @calibre-cloud/deploy-cloudflare run smoke:local
